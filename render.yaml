# Render Blueprint: one web service with a persistent disk for the SQLite database.
# Free plans can't have a disk (the database would be wiped on every restart), so this
# uses the lowest paid plan. A service with a disk can't be scaled past one instance,
# which is exactly what SQLite needs anyway.
services:
  - type: web
    name: devlog
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: devlog-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0 # Render requires binding to all interfaces (PORT is provided by Render)
      - key: DEVLOG_DB
        value: /var/data/devlog.db # on the persistent disk
      - key: TRUST_PROXY
        value: "1" # HTTPS is terminated by Render's proxy; lets the app see the real scheme and client IP
